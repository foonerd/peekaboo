# HAProxy: Volumio's page at https://music.example.com, by way of Peekaboo
# on the player at 192.168.1.50, behind a sign-in.
#
# PASSWORD-HASH is what `openssl passwd -6` prints for the password. The
# certificate's file holds the certificate, its chain and its key, one
# after the other:
#     cat fullchain.pem privkey.pem > /etc/ssl/music.example.com/haproxy.pem

defaults
    mode http
    timeout connect 5s
    timeout client  1m
    timeout server  1m
    # A WebSocket stays open for as long as the page does.
    timeout tunnel  1h

userlist volumio
    user music password PASSWORD-HASH

frontend volumio
    bind :80
    bind :443 ssl crt /etc/ssl/music.example.com/haproxy.pem

    http-request redirect scheme https code 301 unless { ssl_fc }
    http-request auth realm Volumio unless { http_auth(volumio) }
    # The password stops here: the player has no use for it.
    http-request del-header Authorization
    http-request set-header X-Forwarded-Proto https
    option forwardfor

    default_backend player

backend player
    server player 192.168.1.50:3080
