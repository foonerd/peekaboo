# lighttpd: Volumio's page at https://music.example.com, by way of Peekaboo
# on the player at 192.168.1.50, behind a sign-in.
#
# lighttpd 1.4.56 or later; included from lighttpd.conf. The sign-in's file
# is made with
#     htpasswd -B -c /etc/lighttpd/peekaboo.htpasswd music

server.modules += ( "mod_openssl", "mod_redirect", "mod_auth", "mod_authn_file", "mod_setenv", "mod_proxy" )

$SERVER["socket"] == ":443" {
    ssl.engine  = "enable"
    ssl.pemfile = "/etc/ssl/music.example.com/fullchain.pem"
    ssl.privkey = "/etc/ssl/music.example.com/privkey.pem"
}

$HTTP["host"] == "music.example.com" {
    $HTTP["scheme"] == "http" {
        url.redirect = ( "" => "https://music.example.com${url.path}${qsa}" )
    }

    $HTTP["scheme"] == "https" {
        auth.backend = "htpasswd"
        auth.backend.htpasswd.userfile = "/etc/lighttpd/peekaboo.htpasswd"
        auth.require = ( "" => ( "method" => "basic", "realm" => "Volumio", "require" => "valid-user" ) )

        # The password stops here: the player has no use for it.
        setenv.set-request-header = ( "Authorization" => "" )

        proxy.server = ( "" => ( ( "host" => "192.168.1.50", "port" => 3080 ) ) )
        # WebSocket connections are passed on.
        proxy.header = ( "upgrade" => "enable" )
    }
}
