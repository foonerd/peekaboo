# Envoy: Volumio's page at https://music.example.com, by way of Peekaboo on
# the player at 192.168.1.50, behind a sign-in.
#
# Envoy 1.29 or later, for the sign-in's filter. PASSWORD-HASH is what
# follows `{SHA}` in the line `htpasswd -ns music` prints; the filter takes
# no other kind.

static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 80 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http
                route_config:
                  virtual_hosts:
                    - name: to_https
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          redirect: { https_redirect: true }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: https
      address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/ssl/music.example.com/fullchain.pem }
                    private_key: { filename: /etc/ssl/music.example.com/privkey.pem }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: volumio
                # WebSocket connections are passed on.
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  virtual_hosts:
                    - name: volumio
                      domains: ["music.example.com"]
                      # The password stops here: the player has no use for it.
                      request_headers_to_remove: ["authorization"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: player
                            # No limit on how long an answer may take: the
                            # page waits on the player, and files are long.
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.basic_auth
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
                      users:
                        inline_string: "music:{SHA}PASSWORD-HASH"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: player
      type: STATIC
      connect_timeout: 5s
      load_assignment:
        cluster_name: player
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 192.168.1.50, port_value: 3080 }
