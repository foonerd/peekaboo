# Apache httpd: Volumio's page at https://music.example.com, by way of
# Peekaboo on the player at 192.168.1.50, behind a sign-in.
#
# httpd 2.4.47 or later, with the modules ssl, proxy, proxy_http, headers,
# alias, auth_basic, authn_file and authz_user. On Debian and Ubuntu:
#     a2enmod ssl proxy proxy_http headers auth_basic authn_file authz_user
# The sign-in's file is made with
#     htpasswd -B -c /etc/apache2/peekaboo.htpasswd music

<VirtualHost *:80>
    ServerName music.example.com
    Redirect permanent "/" "https://music.example.com/"
</VirtualHost>

<VirtualHost *:443>
    ServerName music.example.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/music.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/music.example.com/privkey.pem

    <Location "/">
        AuthType Basic
        AuthName "Volumio"
        AuthUserFile /etc/apache2/peekaboo.htpasswd
        Require valid-user
    </Location>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # The password stops here: the player has no use for it.
    RequestHeader unset Authorization

    # upgrade=websocket passes WebSocket connections on.
    ProxyPass        "/" "http://192.168.1.50:3080/" upgrade=websocket
    ProxyPassReverse "/" "http://192.168.1.50:3080/"
</VirtualHost>
