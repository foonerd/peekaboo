# nginx: Volumio's page at https://music.example.com, by way of Peekaboo on
# the player at 192.168.1.50, behind a sign-in.
#
# For the http context: /etc/nginx/conf.d/peekaboo.conf on most systems.
# The sign-in's file is made with
#     htpasswd -B -c /etc/nginx/peekaboo.htpasswd music
# and takes a name more with each `htpasswd -B /etc/nginx/peekaboo.htpasswd <name>`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name music.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name music.example.com;

    ssl_certificate     /etc/ssl/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/music.example.com/privkey.pem;

    auth_basic           "Volumio";
    auth_basic_user_file /etc/nginx/peekaboo.htpasswd;

    # Volumio takes uploads of any size: a plugin's zip, a background.
    client_max_body_size 0;

    location / {
        proxy_pass http://192.168.1.50:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The password stops here: the player has no use for it.
        proxy_set_header Authorization "";
    }
}
